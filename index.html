<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Class Race – Favourite Subject</title>
<style>
:root{color-scheme:dark;--bg:#14213d;--chalk:#fdf6e3;--board:#1f5e45;--gold:#ffc233;--ink:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;touch-action:none}
#wrap{position:relative;height:min(82vh,140vw);aspect-ratio:2/3;border-radius:16px;overflow:hidden;box-shadow:0 0 0 4px var(--gold)}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.55)}
#ov.off{display:none}
.card{background:var(--chalk);color:var(--ink);border-radius:18px;padding:16px;width:88%;max-height:92%;overflow:auto;text-align:center;box-sizing:border-box}
.card h2{margin:0 0 6px;font-size:24px}.card h3{margin:10px 0 2px;font-size:17px;color:var(--board)}
.card p{margin:4px 0;font-size:16px;line-height:1.4}
.big{font-size:32px;font-weight:800;color:var(--board);margin:8px 0}
.mine{font-size:40px;letter-spacing:6px}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.opt,.go{font:inherit;cursor:pointer;border:3px solid #cfd8c8;background:#fff;border-radius:14px;padding:6px 14px;color:var(--ink)}
.opt{font-size:46px;min-width:84px}.opt.txt{font-size:22px;font-weight:700}
.opt.ok{border-color:#2a9d4a;background:#d9f5e1}.opt.no{border-color:#d62839;background:#fde0e3}
.go{background:var(--gold);border-color:var(--gold);font-size:22px;font-weight:800;margin:8px 4px 0;padding:8px 22px}
.go.alt{background:#fff;border-color:#cfd8c8}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;padding:5px 0;text-align:left;border-bottom:1px solid #e3e0d0}
.mini{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:6px 10px;background:var(--gold);color:var(--ink);cursor:pointer;min-width:92px}
.mini.on{background:#1f5e45;color:#fff}.mini:disabled{background:#d8d8d0;color:#777;cursor:default}
.sw{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:-3px;border:2px solid #14213d}
#fb{min-height:30px;font-size:22px;font-weight:800;margin-top:8px}
#pad{display:flex;gap:12px}
#pad button{font-size:30px;width:120px;height:52px;border-radius:14px;border:0;background:var(--gold);color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div>
<div id="pad"><button id="bL" aria-label="Trái">◀</button><button id="bR" aria-label="Phải">▶</button></div>
<script>
const W=480,H=720,HY=190,PY=630,L=34,cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
cv.width=W;cv.height=H;
const items1=[{w:'school bag',e:'🎒'},{w:'set square',e:'📐'},{w:'pencil case',e:'👝'},{w:'board',e:'🪧'},{w:'marker',e:'🖍️'},{w:'map',e:'🗺️'}];
const items2=[{w:'IT',n:'Information Technology (IT)',e:'💻'},{w:'PE',n:'Physical Education (PE)',e:'⚽'},{w:'art',e:'🎨'},{w:'music',e:'🎵'},{w:'fun',e:'🎉'},{w:'interesting',e:'🤩'}];
const subj=[items2[0],items2[1],items2[2],items2[3]];
const sents=['What’s your favourite subject?','My favourite subject is art.','My favourite subject is PE.','My favourite subject is Science.','Music is fun.','IT is interesting.','Science is useful.'];
const mist=[['My favourite subject are music.','My favourite subject is music.','My favourite subject am music.','My favourite subjects is music.'],['What your favourite subject?','What’s your favourite subject?','What’s you favourite subject?','What are your favourite subject?'],['PE are fun.','PE is fun.','PE am fun.','PE is funny.'],['Art is funny.','Art is fun.','Art fun.','Art is fan.'],['IT is interest.','IT is interesting.','IT is interested.','IT interesting.'],['Music are interesting.','Music is interesting.','Music am interesting.','Music is interest.']];
const cars=[{id:'#e63946',n:'Đỏ Ferrari',c:0},{id:'#3a86ff',n:'Xanh dương',c:20},{id:'#2ecc71',n:'Xanh lá',c:30},{id:'#9b5de5',n:'Tím',c:50},{id:'#ffc233',n:'Vàng',c:80}];
const ups=[{id:'eng',n:'🔧 Động cơ mạnh hơn',max:2,cost:l=>35*(l+1)},{id:'nit',n:'🔥 Nitro kéo dài 6 giây',max:1,cost:()=>40},{id:'mag',n:'🧲 Nam châm hút xu làn bên cạnh',max:1,cost:()=>40}];
const FONT="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',system-ui,sans-serif";
let S={w:0,cars:['#e63946'],car:'#e63946',eng:0,nit:0,mag:0,les:'all'};
try{Object.assign(S,JSON.parse(localStorage.getItem('cs_b3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cs_b3',JSON.stringify(S))}catch(e){}};
let st='menu',lane=1,px=1,coins=0,P=0,objs=[],rivals=[],t=0,spawnT=1,qT=7,inv=0,stunT=0,nitT=0,scroll=0,last=0;
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>a.slice().sort(()=>Math.random()-.5);
const sp=p=>30+110*p,yy=p=>HY+(PY-HY)*p,pp=d=>Math.pow(d,1.8);
function show(h){ov.innerHTML=h;ov.className=''}function hide(){ov.className='off'}
const rank=()=>1+rivals.filter(r=>r.R>P).length;
function menu(){st='menu';show(`<div class="card"><h2>🏎️ F1 Class Race</h2><p><b>Favourite Subject</b></p><p>Về đích đầu tiên để thắng! Xe đối thủ chạy nhanh và cũng biết dùng Nitro! Hãy trả lời đúng để bật Nitro 🔥.</p><p>Nhặt hộp quà 🎁 để trả lời câu hỏi, nhặt xu 🪙, tránh rào chắn 🚧. Dùng ◀ ▶, phím mũi tên hoặc vuốt để đổi làn.</p><p class="big">Ví: 🪙 ${S.w}</p><button class="go" id="s">Xuất phát</button><button class="go alt" id="sh">🛒 Cửa hàng</button></div>`);
 document.getElementById('s').onclick=start;document.getElementById('sh').onclick=shop}
function start(){coins=0;P=0;objs=[];t=0;spawnT=1.2;qT=7;inv=0;stunT=0;nitT=0;lane=1;px=1;
 rivals=[{R:.5,v:.43,col:'#ff7b00',lane:0,x:0,ct:2,nt:0,nc:3},{R:.3,v:.455,col:'#f1faee',lane:2,x:2,ct:3,nt:0,nc:5},{R:.15,v:.48,col:'#06b6a4',lane:1,x:1,ct:1,nt:0,nc:7}];hide();st='play'}
function finish(){st='over';const r=1+rivals.filter(x=>x.R>=L).length,bonus=[30,20,10,5][r-1],medal=['🥇','🥈','🥉','🏁'][r-1];S.w+=coins+bonus;save();
 show(`<div class="card"><h2>🏁 Về đích!</h2><p class="big">${medal} Hạng ${r}/4</p><p>Xu nhặt được: ${coins} · Thưởng hạng: ${bonus}</p><p>Ví của con: ${S.w} xu.</p><button class="go" id="s">Đua lại</button><button class="go alt" id="sh">🛒 Cửa hàng</button></div>`);
 document.getElementById('s').onclick=start;document.getElementById('sh').onclick=shop}
function shop(){st='shop';let h=`<div class="card"><h2>🛒 Cửa hàng</h2><p class="big">🪙 ${S.w}</p><h3>Màu xe</h3>`;
 cars.forEach(x=>{const own=S.cars.includes(x.id),on=S.car==x.id;h+=`<div class="row"><span><i class="sw" style="background:${x.id}"></i> ${x.n}</span><button class="mini" data-h="${x.id}" ${on||(!own&&S.w<x.c)?'disabled':''}>${on?'Đang dùng':own?'Dùng':x.c+' 🪙'}</button></div>`});
 h+=`<h3>Nâng cấp</h3>`;
 ups.forEach(u=>{const l=S[u.id],full=l>=u.max,c=u.cost(l);h+=`<div class="row"><span>${u.n}${u.max>1?` (${l}/${u.max})`:''}</span><button class="mini" data-u="${u.id}" ${full||S.w<c?'disabled':''}>${full?'Đã đủ':c+' 🪙'}</button></div>`});
 h+=`<button class="go" id="bk">Quay lại</button></div>`;show(h);
 ov.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const id=b.dataset.h,x=cars.find(k=>k.id==id);if(S.cars.includes(id))S.car=id;else if(S.w>=x.c){S.w-=x.c;S.cars.push(id);S.car=id}save();shop()});
 ov.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=ups.find(k=>k.id==b.dataset.u),c=u.cost(S[u.id]);if(S[u.id]<u.max&&S.w>=c){S.w-=c;S[u.id]++;save()}shop()});
 document.getElementById('bk').onclick=menu}
function mkPic(arr){const k=rnd(2),it=arr[rnd(arr.length)],three=shuf([it,...shuf(arr.filter(x=>x!==it)).slice(0,2)]);
 if(k==0)return{t:'📖 Đọc và chọn hình đúng',p:`<div class="big">${it.n||it.w}</div>`,o:three.map(x=>({h:x.e,ok:x===it}))};
 return{t:'👀 Nhìn hình và chọn từ đúng',p:`<div class="mine">${it.e}</div>`,txt:1,o:three.map(x=>({h:x.w,ok:x===it}))}}
function mkQ1(){if(Math.random()>.34)return mkPic(items1);
 const mine=shuf(items1).slice(0,3),have=Math.random()<.5,ask=have?mine[rnd(3)]:shuf(items1.filter(x=>!mine.includes(x)))[0];
 return{t:'🎒 Đồ của con có gì?',p:`<div class="mine">${mine.map(x=>x.e).join(' ')}</div><div class="big">Do you have a ${ask.w}?</div>`,txt:1,o:[{h:'Yes, I do.',ok:have},{h:'No, I don’t.',ok:!have}]}}
function mkQ2(){const r=rnd(10);
 if(r<3)return mkPic(items2);
 if(r<5){const it=subj[rnd(4)];return{t:'✏️ Chọn từ điền vào chỗ trống',p:`<div class="mine">${it.e}</div><div class="big">My favourite subject is ___.</div>`,txt:1,o:shuf([it,...shuf(subj.filter(x=>x!==it)).slice(0,2)]).map(x=>({h:x.w,ok:x===it}))}}
 if(r<8){const m=mist[rnd(mist.length)];return{t:'🔍 Tìm và sửa lỗi sai',p:`<div class="big">${m[0]}</div><p>Chọn câu đã sửa đúng.</p>`,txt:1,why:'Câu đúng: '+m[1],o:shuf(m.slice(1)).map(x=>({h:x,ok:x===m[1]}))}}
 return{t:'🔤 Sắp xếp thành câu',p:'<p>Chạm vào các từ theo đúng thứ tự.</p>',sort:sents[rnd(sents.length)]}}
function mkQ(){return mkQ2()}
function ask(){st='q';const q=mkQ();let done=0;
 show(`<div class="card"><h2>${q.t}</h2>${q.p}<div class="opts" id="line"></div><div class="opts" id="os"></div><div id="fb"></div></div>`);
 const os=document.getElementById('os'),fb=document.getElementById('fb'),line=document.getElementById('line');
 const fin=ok=>{done=1;if(ok){nitT=S.nit?6:4;fb.textContent='🔥 Nitro! Tăng tốc nào!'}else{stunT=1.5;fb.textContent='😵 Xe bị chậm lại!'}
  if(q.why)fb.textContent+=' '+q.why;setTimeout(()=>{objs=objs.filter(x=>x.d<.55);hide();st='play';inv=1},q.why?2600:1100)};
 const mk=(txt,cls,fn)=>{const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b};
 if(q.sort){const ws=q.sort.split(' '),pool=shuf(ws.map((w,i)=>({w,i})));let pick=[];
  const rs=()=>{line.innerHTML='';os.innerHTML='';pick.forEach(c=>line.append(mk(c.w,'opt txt ok',()=>{if(!done){pick=pick.filter(x=>x!==c);rs()}})));
   pool.filter(c=>!pick.includes(c)).forEach(c=>os.append(mk(c.w,'opt txt',()=>{if(done)return;pick.push(c);rs();if(pick.length==ws.length){const ok=pick.map(x=>x.w).join(' ')==q.sort;if(!ok)q.why='Đáp án: '+q.sort;fin(ok)}})))};
  rs();return}
 q.o.forEach(o=>{const b=mk(o.h,'opt'+(q.txt?' txt':''),()=>{if(done)return;
  if(o.ok)b.classList.add('ok');else{b.classList.add('no');[...os.children].forEach((c,i)=>{if(q.o[i].ok)c.classList.add('ok')})}
  fin(o.ok)});os.appendChild(b)})}
function spawn(){if(qT<=0){const l=rnd(3);for(let i=1;i<4;i++)objs.push({d:-(i-1)*.07,lane:l,k:'c'});objs.push({d:-.21,lane:l,k:'g'});qT=7;return}
 const l=rnd(3);if(Math.random()<.28)objs.push({d:0,lane:l,k:'b'});else for(let i=0;i<3;i++)objs.push({d:-i*.07,lane:l,k:'c'})}
function upd(dt){t+=dt;qT-=dt;spawnT-=dt;inv-=dt;stunT-=dt;nitT-=dt;
 let v=.4+.03*S.eng+(nitT>0?.22:0);if(stunT>0)v*=.5;
 P+=v*dt;scroll=(scroll+v*dt*18)%2;
 if(spawnT<=0&&L-P>1.3){spawn();spawnT=1.1+Math.random()*.5}
 px+=(lane-px)*Math.min(1,dt*14);
 for(const r of rivals){r.nc-=dt;r.nt-=dt;if(r.nc<=0&&r.nt<=0){r.nt=2.5;r.nc=7+Math.random()*4}const gap=P-r.R;r.R+=(r.v+.02*Math.sin(t*.7+r.lane)+(r.nt>0?.18:0)+(gap>0?Math.min(.06,gap*.1):0))*dt;r.ct-=dt;if(r.ct<=0){r.lane=rnd(3);r.ct=2+Math.random()*2}r.x+=(r.lane-r.x)*Math.min(1,dt*3);
  if(Math.abs(1-(r.R-P))<.06&&Math.abs(px-r.x)<.6&&inv<=0){stunT=1.2;inv=1.5}}
 for(const o of objs){o.d+=v*dt;
  if(o.d>.92&&o.d<1.06&&!o.x){const dx=Math.abs(px-o.lane);
   if(o.k=='c'&&dx<(S.mag?1.55:.55)){o.x=1;coins++}
   else if(o.k=='g'&&dx<.6){o.x=1;ask();return}
   else if(o.k=='b'&&dx<.55){o.x=1;if(inv<=0){stunT=1.5;inv=1.5}}}}
 objs=objs.filter(o=>o.d<1.1&&!o.x);
 if(P>=L)finish()}
function txt(s,x,y,sz,al='center',c='#fff'){g.font=`800 ${sz}px ${FONT}`;g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function trap(d1,d2,hf,col){const p1=pp(d1),p2=pp(d2);g.fillStyle=col;g.beginPath();g.moveTo(W/2-hf*sp(p1),yy(p1));g.lineTo(W/2+hf*sp(p1),yy(p1));g.lineTo(W/2+hf*sp(p2),yy(p2));g.lineTo(W/2-hf*sp(p2),yy(p2));g.fill()}
function bands(n,fn){const q=scroll%2,f=Math.floor(q),r=q-f;for(let i=-1;i<n;i++){const d1=Math.max(0,(i+r)/n),d2=Math.min((i+1+r)/n,1.3);if(d2>d1)fn(d1,d2,((i+f)%2+2)%2)}}
function strip(d1,d2,a0,a1,col){const p1=pp(d1),p2=pp(d2);g.fillStyle=col;for(const sd of[-1,1]){g.beginPath();g.moveTo(W/2+sd*a0*sp(p1),yy(p1));g.lineTo(W/2+sd*a1*sp(p1),yy(p1));g.lineTo(W/2+sd*a1*sp(p2),yy(p2));g.lineTo(W/2+sd*a0*sp(p2),yy(p2));g.fill()}}
function car(x,y,s,col,fire){const w=s*.72,h=s*.5,R=(a,b,c,d)=>g.fillRect(a,b,c,d);
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y,w*.55,h*.12,0,0,7);g.fill();
 if(fire){g.fillStyle='rgba(255,140,0,.85)';g.beginPath();g.moveTo(x-w*.12,y-h*.2);g.lineTo(x,y+h*.45);g.lineTo(x+w*.12,y-h*.2);g.fill()}
 g.fillStyle='#14161c';R(x-w*.43,y-h*1.0,w*.14,h*.3);R(x+w*.29,y-h*1.0,w*.14,h*.3);
 g.fillStyle=col;R(x-w*.2,y-h*.9,w*.4,h*.7);g.fillStyle='rgba(0,0,0,.18)';R(x-w*.03,y-h*.9,w*.06,h*.7);
 g.fillStyle='#14161c';R(x-w*.5,y-h*.62,w*.22,h*.5);R(x+w*.28,y-h*.62,w*.22,h*.5);
 g.fillStyle=col;R(x-w*.45,y-h*.72,w*.9,h*.12);g.fillStyle='#14161c';R(x-w*.47,y-h*.8,w*.05,h*.28);R(x+w*.42,y-h*.8,w*.05,h*.28);
 g.fillStyle='#f1faee';g.beginPath();g.arc(x,y-h*.72,w*.1,0,7);g.fill();g.fillStyle='#14161c';g.fillRect(x-w*.07,y-h*.76,w*.14,h*.05)}
function draw(){
 const sk=g.createLinearGradient(0,0,0,HY);sk.addColorStop(0,'#3b6fb6');sk.addColorStop(1,'#cfe6f7');g.fillStyle=sk;g.fillRect(0,0,W,HY);
 g.fillStyle='#8f98ab';g.fillRect(0,HY-38,W,32);
 const cc=['#e63946','#ffc233','#f1faee','#3a86ff','#ff7b00'];for(let i=0;i<48;i++)for(let j=0;j<3;j++){g.fillStyle=cc[(i*7+j*3)%5];g.fillRect(i*10+2,HY-36+j*10,5,5)}
 g.fillStyle='#f4f4f4';g.fillRect(0,HY-6,W,6);g.fillStyle='#d62839';for(let i=0;i<W;i+=40)g.fillRect(i,HY-6,20,6);
 g.fillStyle='#2e8b57';g.fillRect(0,HY,W,H-HY);
 bands(10,(a,b,k)=>{if(k)trap(a,b,20,'rgba(0,0,0,.09)')});
 trap(0,1.3,1.5,'#3a3d46');
 bands(16,(a,b,k)=>strip(a,b,1.5,1.68,k?'#d62839':'#f4f4f4'));
 strip(0,1.3,1.44,1.48,'#f4f4f4');
 bands(12,(a,b,k)=>{if(!k)return;const p1=pp(a),p2=pp(b);g.fillStyle='rgba(255,255,255,.55)';for(const sd of[-.5,.5]){const w1=.03*sp(p1),w2=.03*sp(p2);g.beginPath();g.moveTo(W/2+sd*sp(p1)-w1,yy(p1));g.lineTo(W/2+sd*sp(p1)+w1,yy(p1));g.lineTo(W/2+sd*sp(p2)+w2,yy(p2));g.lineTo(W/2+sd*sp(p2)-w2,yy(p2));g.fill()}});
 const fd=1-(L-P);
 if(fd>0&&fd<1.25){const p=pp(fd),s=sp(p),y=yy(p),n=12,cw=3*s/n,hh=s*.1;for(let r=0;r<2;r++)for(let i=0;i<n;i++){g.fillStyle=(i+r)%2?'#f4f4f4':'#14161c';g.fillRect(W/2-1.5*s+i*cw,y-hh*(2-r),cw+1,hh)}}
 const list=[...objs,...rivals.map(r=>({k:'r',d:1-(r.R-P),x:r.x,col:r.col,fire:r.nt>0}))].sort((a,b)=>a.d-b.d);
 for(const o of list){if(o.d<0||o.d>1.25)continue;const p=pp(o.d),s=sp(p),y=yy(p),x=o.k=='r'?W/2+(o.x-1)*s:W/2+(o.lane-1)*s;
  if(o.k=='c'){g.fillStyle='#ffc233';g.beginPath();g.arc(x,y-6-8*p,5+13*p,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=1+2*p;g.stroke()}
  else if(o.k=='b'){g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x,y,s*.34,s*.07,0,0,7);g.fill();txt('🚧',x,y-s*.34,s*.75)}
  else if(o.k=='r')car(x,y,s,o.col,o.fire);
  else{const z=s*.6,by=y-z*.55-8*Math.sin(t*4)*p;g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,y,z*.45,z*.12,0,0,7);g.fill();
   const gl=g.createRadialGradient(x,by,2,x,by,z*.85);gl.addColorStop(0,'rgba(255,230,120,.8)');gl.addColorStop(1,'rgba(255,230,120,0)');g.fillStyle=gl;g.beginPath();g.arc(x,by,z*.85,0,7);g.fill();txt('🎁',x,by,z)}}
 const ex=W/2+(px-1)*sp(1);
 if(inv<=0||Math.floor(inv*10)%2||stunT<=0&&inv<=0)car(ex,PY+20,sp(1),S.car,nitT>0);
 txt('🪙 '+coins,16,32,28,'left','#ffc233');txt('🏁 Hạng '+rank()+'/4',W-16,32,26,'right');
 g.fillStyle='rgba(0,0,0,.45)';g.fillRect(16,60,W-32,10);const bx=r=>16+(W-32)*Math.min(1,r/L);
 for(const r of rivals){g.fillStyle=r.col;g.beginPath();g.arc(bx(r.R),65,5,0,7);g.fill()}
